<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        input, button { margin: 8px 0; padding: 8px; width: 300px; }
    </style>
</head>
<body>
    <!-- Registracijska stran za aplikacijo osebnih zapiskov. -->
    <h1>Register</h1>
    {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}
    <!-- Registracijski obrazec pošlje novo uporabniško ime/geslo na register ruta. -->
    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Register</button>
    </form>
    <p><a href="{{ url_for('login') }}">Login</a></p>
</body>
</html>
